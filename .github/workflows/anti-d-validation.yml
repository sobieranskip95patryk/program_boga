name: Anti-D Validation & CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============ JOB 1: Anti-D Validation (Python) ============
  anti_d_validation:
    name: Anti-D Coherence Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./MTA_LOGIC_VALIDATION
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Anti-D validation
        working-directory: ./MTA_LOGIC_VALIDATION
        run: |
          python src/anti_d_validator.py --validate-all --strict
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: anti-d-report
          path: MTA_LOGIC_VALIDATION/reports/

  # ============ JOB 2: Cypher Syntax Check ============
  cypher_validation:
    name: Cypher Query Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Cypher syntax
        working-directory: ./MTA_CORE_GRAPH/cypher
        run: |
          echo "Checking Cypher syntax..."
          for file in *.cypher; do
            echo "  ✓ Validating $file"
            grep -E "^(MATCH|CREATE|SET|DELETE|WITH|RETURN|WHERE|ORDER|LIMIT)" "$file" > /dev/null || echo "Warning: $file may have syntax issues"
          done

  # ============ JOB 3: Frontend Build ============
  frontend_build:
    name: Next.js Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: MTA_HYPER_INTERFACE/package-lock.json
      
      - name: Install dependencies
        working-directory: ./MTA_HYPER_INTERFACE
        run: npm ci
      
      - name: Lint TypeScript
        working-directory: ./MTA_HYPER_INTERFACE
        run: npm run lint
      
      - name: Build Next.js
        working-directory: ./MTA_HYPER_INTERFACE
        run: npm run build

  # ============ JOB 4: Docker Build Check ============
  docker_build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Neo4j image
        uses: docker/build-push-action@v4
        with:
          context: ./MTA_CORE_GRAPH/docker
          push: false
          tags: mta-neo4j:latest
      
      - name: Build validation engine image
        uses: docker/build-push-action@v4
        with:
          context: ./MTA_LOGIC_VALIDATION
          push: false
          tags: mta-validation-engine:latest
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./MTA_HYPER_INTERFACE
          push: false
          tags: mta-hyper-interface:latest

  # ============ JOB 5: Integration Tests ============
  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [anti_d_validation, frontend_build]
    
    services:
      neo4j:
        image: neo4j:5.13
        env:
          NEO4J_AUTH: neo4j/test_password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7687:7687
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Wait for Neo4j
        run: |
          for i in {1..30}; do
            nc -z localhost 7687 && echo "Neo4j is ready" && exit 0
            echo "Waiting for Neo4j... ($i/30)"
            sleep 1
          done
          exit 1
      
      - name: Run integration tests
        run: |
          echo "Integration tests would run here"
          echo "Testing Neo4j connectivity, API endpoints, etc."

  # ============ JOB 6: Final Report ============
  report:
    name: CI/CD Report
    runs-on: ubuntu-latest
    if: always()
    needs: [anti_d_validation, cypher_validation, frontend_build, docker_build, integration_tests]
    
    steps:
      - name: Check workflow status
        run: |
          echo "=== MTAQuestWebsideX CI/CD REPORT ===" > report.txt
          echo "Anti-D Validation: ${{ needs.anti_d_validation.result }}" >> report.txt
          echo "Cypher Validation: ${{ needs.cypher_validation.result }}" >> report.txt
          echo "Frontend Build: ${{ needs.frontend_build.result }}" >> report.txt
          echo "Docker Build: ${{ needs.docker_build.result }}" >> report.txt
          echo "Integration Tests: ${{ needs.integration_tests.result }}" >> report.txt
          cat report.txt
      
      - name: Upload final report
        uses: actions/upload-artifact@v3
        with:
          name: ci-cd-report
          path: report.txt
      
      - name: Slack notification (if failed)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'MTAQuestWebsideX CI/CD pipeline failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
